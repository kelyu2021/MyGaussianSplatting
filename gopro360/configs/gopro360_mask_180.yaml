# ═══════════════════════════════════════════════════════════════════════════
#  GoPro 360  –  Gaussian Splatting Config
#
#  Run from gopro360/ directory:
#    cd MyGaussianSplatting/gopro360
#    python train.py --cfg_file configs/gopro360_mask.yaml
# ═══════════════════════════════════════════════════════════════════════════

task: gopro360_exp_mask
source_path: colmap/output                         # relative to gopro360/ (cwd)
exp_name: gopro360_10s_mask
gpus: [0,1]                                          # use free GPU (0-3 occupied by VLLM)

# ── Data ──────────────────────────────────────────────────────────────────
data:
  type: GOPRO360
  white_background: false
  split_test: 8                                    # every 8th image → test set
  split_train: 1
  extent: 15
  point_cloud_path: colmap/output/dense_mask_relaxed/fused.ply
  mask_dir: colmap/output/masks_roof_depth_sky_mass13k                # sky + roof masks (0=masked, 255=valid)
  depth_dir: colmap/output/depth                     # Depth Anything V2 depth maps (.npy)

# ── Model ─────────────────────────────────────────────────────────────────
model:
  gaussian:
    sh_degree: 3
    fourier_dim: 5
    fourier_scale: 1.0
    flip_prob: 0.5
  nsg:
    include_bkgd: true
    include_obj: false                             # no dynamic objects
    include_sky: false                             # disable sky (no sky masks available)
    opt_track: false

# ── Training ──────────────────────────────────────────────────────────────
train:
  epochs: 180                                      # 180 epochs × 168 cameras ≈ 30,240 iters
  test_epochs: [30, 60, 90, 120, 180]
  save_epochs: [180]
  checkpoint_epochs: [60, 120, 180]

# ── Optimisation ──────────────────────────────────────────────────────────
optim:
  densification_interval: 50
  densify_from_epoch: 3
  densify_grad_threshold_bkgd: 0.0001
  densify_grad_abs_bkgd: false
  densify_grad_threshold: 0.0001
  densify_until_epoch: 90
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.005
  opacity_lr: 0.05
  opacity_reset_epoch_interval: 18
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_epochs: 135                      # 75% of training
  rotation_lr: 0.001
  scaling_lr: 0.005

  # ── Gaussian count limits ──
  max_total_gaussians: 4500000
  target_final_gaussians: 4000000
  hole_seed_epoch_interval: 4
  hole_seed_until_epoch: 150
  hole_max_seeds: 60000
  prune_epoch_interval: 30
  prune_min_opacity: 0.003

  lambda_l1: 1.0
  lambda_dssim: 0.2
  lambda_sky: 0.0                                  # no sky masks for GoPro
  lambda_sky_scale: []
  lambda_reg: 0.0
  lambda_depth_lidar: 0.0                          # no LiDAR depth
  lambda_color_correction: 0.02

# ── Render ────────────────────────────────────────────────────────────────
render:
  fps: 5
